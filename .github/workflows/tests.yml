name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.17.5
      - name: Lint
        run: ruff check custom_components tests
      - name: Check formatting
        run: ruff format --check custom_components tests

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned, Python 3.12
            python: "3.12"
            requirements: requirements_test.txt
          - name: latest Home Assistant, Python 3.13
            python: "3.13"
            requirements: requirements_test_latest.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.requirements }}"
      - name: Show Home Assistant version
        run: |
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Run tests
        run: python -m pytest -q
